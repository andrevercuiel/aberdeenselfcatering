name: Import existing ten activity logos into independent site

on:
  push:
    branches:
      - feature/ten-activity-logo-pages
    paths:
      - .github/workflows/import-logo-assets.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Fetch verified activity branch from original monorepo
        run: |
          set -euo pipefail
          git clone --single-branch --depth 1 --branch codex/aberdeen-ten-activity-logos https://github.com/andrevercuiel/visitaberdeen.git /tmp/activity-source
          actual="$(git -C /tmp/activity-source rev-parse HEAD)"
          expected="9532583ea0764fa696522381d7ec674ec8b3d10e"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Activity source branch changed unexpectedly. Stopping."
            exit 1
          fi
          s=/tmp/activity-source/aberdeen-self-catering
          for file in \
            app/activities/page.tsx \
            app/activities/layout.tsx \
            'app/activities/[activity]/page.tsx' \
            app/globals.css \
            app/sitemap.ts \
            components/Header.tsx \
            lib/activities.ts; do
            mkdir -p "$(dirname "$file")"
            cp "$s/$file" "$file"
          done
          mkdir -p public/media/brand
          cp "$s/public/media/brand"/activity-*.webp public/media/brand/
          count=$(find public/media/brand -maxdepth 1 -name 'activity-*.webp' | wc -l)
          test "$count" -eq 10
      - name: Validate the copied application builds
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.aberdeenselfcatering.co.za
      - name: Commit activity feature on its branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/activities app/globals.css app/sitemap.ts components/Header.tsx lib/activities.ts public/media/brand/
          if ! git diff --cached --quiet; then
            git commit -m "Copy all ten original activity logos and linked pages"
            git push origin HEAD:feature/ten-activity-logo-pages
          fi
