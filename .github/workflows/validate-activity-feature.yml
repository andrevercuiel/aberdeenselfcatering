name: Validate ten activity pages
on:
  push:
    branches:
      - feature/ten-activity-logo-pages
    paths:
      - .github/workflows/validate-activity-feature.yml
      - app/**
      - lib/**
      - components/**
      - public/**
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.aberdeenselfcatering.co.za
