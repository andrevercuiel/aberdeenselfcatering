name: Validate Aberdeen Self Catering build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-asc.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'next.config.mjs'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build standalone website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.aberdeenselfcatering.co.za
